[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prometra"
version = "0.1.0"
description = "The Intelligence Layer for AI-Assisted Software Development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "GitPython>=3.1.30",
    "watchdog>=3.0.0",
    "SQLAlchemy>=2.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
prometra = "prometra.cli.main:app"

[project.entry-points."prometra.connectors"]
claude = "prometra.connectors.claude.connector:ClaudeConnector"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]
